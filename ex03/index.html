<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex03</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="swatch-palette">
        <div class="swatch named">Named</div>
        <div class="swatch hex">HEX</div>
        <div class="swatch rgb">RGB</div>
        <div class="swatch rgba">RGBA</div>
    </section>

    <section class="comparison-container">
        <div class="card opacity-card">
            <div class="card-content">
                <h2>Opacity 0.5</h2>
                <p>Child content is faded along with background.</p>
            </div>
        </div>

        <div class="card rgba-card">
            <div class="card-content">
                <h2>RGBA Alpha 0.5</h2>
                <p>Child content stays solid while background is transparent.</p>
            </div>
        </div>
    </section>

</body>
</html>
